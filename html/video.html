<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>This is an example of the video tag</p>
    <video src="video/video.mp4"
    height="300"
    width="300"
    controls></video>

    <p>This is an example where the video plays automatically </p>
    <video src="video/video.mp4"
    height="300"
    width="300"
    autoplay></video>

    <p>This is an example where the video plays automatically, loop and muted</p>
    <video src="video/video.mp4"
    height="300"
    width="300"
    autoplay
    loop
    muted></video>
</body>
</html>
