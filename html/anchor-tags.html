<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>This is an example of the anchor tag, where the link opens in the same tab</p>
    <a href="https://www.snapchat.com">Open Snapchat</a>
    <p>This is an example of the anchor tag, where the link would be opening in a new tab</p>
    <a href="https://www.instagram.com"
    target="_blank">Open Instagram</a>
</body>
</html>
